
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5}
.header{background:#fff;padding:15px;display:flex;align-items:center;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.container{max-width:600px;margin:0 auto;padding:10px;padding-bottom:100px}
.item{background:#fff;padding:15px;margin:10px 0;border-radius:5px;display:flex;gap:15px}
.item img{width:80px;height:80px;object-fit:cover;border-radius:5px}
.item-info{flex:1}
.qty-controls{display:flex;gap:10px;align-items:center;margin-top:10px}
.qty-btn{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:5px;cursor:pointer}
.summary{background:#fff;padding:15px;margin:10px 0;border-radius:5px;position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto}
.btn-checkout{width:100%;padding:15px;background:#ff6600;color:#fff;border:none;border-radius:5px;font-size:16px;font-weight:bold;cursor:pointer}
.empty{text-align:center;padding:50px;color:#666}
select{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px;font-size:14px}
</style>
</head>
<body>
<div class="header">
  <span onclick="history.back()" style="font-size:20px;cursor:pointer;margin-right:15px">←</span>
  <h2>Cart</h2>
</div>

<div class="container" id="cartContainer"></div>

<script>
let products = [];
const csvData = `name,price,img
1,Classic MX,750,/shirt-01
2,Pique cotton pool,850,/shirt-02
3,Graphic tee,500,/shirt-03
4,Mtx Cotton,600,/shirt-04
5,Lipier Samon,550,/shirt-05
6,Dvt Cotton,560,/shirt-06
7,Modal Royen,750,/shirt-07
8,NkT Corsd,600,/shirt-08
9,SHF Cjf,900,/shirt-09
10,Fsg Hds,750,/shirt-10
11,Saf Gdf,750,/shirt-11
12,SGD Vf,960,/shirt-12
13,Sadc,570,/shirt-13
14,Dhfs,740,/shirt-14
15,Hfd Vjf,500,/shirt-15
16,Dgfd Bvc,660,/shirt-16
17,Gdsc nng,700,/shirt-17
18,Vjgd Hf,547,/shirt-18
19,Fgdv,750,/shirt-19
20,Dhf,960,/shirt-20
21,Bhd Bv,560,/shirt-21
22,Jgd nb,580,/shirt-22
23,Hdsv,780,/shirt-23
24,FSV Hjg,630,/shirt-24
25,DVD Gnf,580,/shirt-25
26,Shgc,246,/shirt-26
27,Fhvc,588,/shirt-27
28,Hgdv Gn,570,/shirt-28
29,HdvBj,680,/shirt-29
30,Nfvbn,560,/shirt-30
31,Jdbn,760,/shirt-31
32,Dbbc,750,/shirt-32
33,Svncv,570,/shirt-33
34,Shnnhn,560,/shirt-34
35,Dbncn,540,/shirt-35
36,Dbvx,750,/shirt-36
37,Fhbcb,600,/shirt-37
38,Dgnnv,950,/shirt-38
39,Dhmgvn,850,/shirt-39
40,Fnmvcm,700,/shirt-40
41,Fjmcn,550,/shirt-41
42,Fmnvm,580,/shirt-42';

function loadProducts(){
  const rows = csvData.split('\n').slice(1);
  products = rows.map((row, i) => {
    const [name, price, img] = row.split(',');
    return {
      id: i + 1,
      name: name.trim(),
      price: parseInt(price.trim()),
      img: img.trim()
    };
  }).filter(p => p.name);
  
  renderCart();
  
 loadProducts();
</script>
<script>
const locations = [
  {name:"Kitui Town", fee:180},
  {name:"Nairobi CBD", fee:300},
  {name:"Mombasa", fee:350},
  {name:"Nakuru", fee:250},
  {name:"Kisumu", fee:280},
  {name:"Other Locations", fee:400}
];

function getSelectedLocation(){
  const saved = localStorage.getItem('selectedLocation');
  return saved? JSON.parse(saved) : locations[0];
}

function renderCart(){
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const container = document.getElementById('cartContainer');
  const selectedLoc = getSelectedLocation();

  if(cart.length === 0){
    container.innerHTML = '<div class="empty">Your cart is empty</div>';
    return;
  }

  let html = '';
  let itemTotal = 0;

  cart.forEach(item => {
    const prod = products.find(p => p.id === item.id);
    const subtotal = prod.price * item.qty;
    itemTotal += subtotal;

    html += `
      <div class="item">
        <img src="${prod.img}">
        <div class="item-info">
          <h4>${prod.name}</h4>
          <p style="color:#ff6600;font-weight:bold">KSh ${subtotal.toLocaleString()}</p>
          <small style="color:#666">KSh ${prod.price.toLocaleString()} each</small>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
            <button class="qty-btn" onclick="removeItem(${item.id})" style="margin-left:auto;color:red">×</button>
          </div>
        </div>
      </div>
    `;
  });

  html += `
    <div class="summary">
      <label style="font-size:12px;color:#666;font-weight:bold">DELIVERY LOCATION</label>
      <select id="locationSelect" onchange="updateLocation()">
        ${locations.map(loc =>
          `<option value="${loc.name}" data-fee="${loc.fee}" ${loc.name === selectedLoc.name? 'selected' : ''}>
            ${loc.name} - KSh ${loc.fee}
          </option>`
        ).join('')}
      </select>

      <div style="display:flex;justify-content:space-between;margin:10px 0">
        <span>Subtotal</span>
        <span style="font-weight:bold">KSh ${itemTotal.toLocaleString()}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin:10px 0">
        <span>Delivery</span>
        <span>KSh ${selectedLoc.fee}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin:15px 0">
        <span>Total</span>
        <span>KSh ${(itemTotal + selectedLoc.fee).toLocaleString()}</span>
      </div>
      <button class="btn-checkout" onclick="checkout()">Checkout</button>
    </div>
  `;

  container.innerHTML = html;
}

function updateLocation(){
  const select = document.getElementById('locationSelect');
  const selected = {
    name: select.value,
    fee: parseInt(select.selectedOptions[0].dataset.fee)
  };
  localStorage.setItem('selectedLocation', JSON.stringify(selected));
  renderCart();
}

function updateQty(id, change){
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const item = cart.find(i => i.id === id);
  if(item){
    item.qty += change;
    if(item.qty <= 0) cart = cart.filter(i => i.id!== id);
  }
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function removeItem(id){
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  cart = cart.filter(i => i.id!== id);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function checkout(){
  const user = localStorage.getItem('user');
  window.location.href = user? 'checkout.html' : 'login.html';
}


</script>
</body>
</html>
