<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart - Ikuthu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f5f5}
.header{background:#fff;padding:15px;display:flex;align-items:center;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.container{max-width:600px;margin:0 auto;padding:10px;padding-bottom:220px}
.item{background:#fff;padding:15px;margin:10px 0;border-radius:8px;display:flex;gap:15px}
.item img{width:80px;height:80px;object-fit:cover;border-radius:5px;border:1px solid #eee}
.item-info{flex:1}
.qty-controls{display:flex;gap:10px;align-items:center;margin-top:10px}
.qty-btn{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:5px;cursor:pointer}
.summary{background:#fff;padding:15px;position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;box-shadow:0 -2px 10px rgba(0,0,0,.15);border-radius:12px 12px 0 0}
.btn-checkout{width:100%;padding:15px;background:#ff6600;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.empty{text-align:center;padding:50px;color:#666}
select{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px}
.trust-bar{background:#e8f5e9;padding:10px;border-radius:5px;margin:10px 0;font-size:13px;text-align:center;color:#2e7d32}
</style>
</head>
<body>
<div class="header"><span onclick="history.back()" style="font-size:20px;cursor:pointer;margin-right:15px">←</span><h2>Cart <span id="cartCount" style="font-size:14px;color:#666;font-weight:normal"></span></h2></div>
<div class="container" id="cartContainer">Loading...</div>
<script>
let allProducts = [];
const locations = [{name:"Kitui Town",fee:180},{name:"Nairobi CBD",fee:300},{name:"Mombasa",fee:350},{name:"Nakuru",fee:250},{name:"Kisumu",fee:280},{name:"Other Locations",fee:400}];
function getLoc(){const s=localStorage.getItem('selectedLocation');return s?JSON.parse(s):locations[0];}
async function load(){
  try{
    const r = await fetch('/api/products');
    const d = await r.json();
    allProducts = Array.isArray(d)? d.map(p=>({id:String(p.id),name:p.name,price:Number(p.price),img:p.image||p.image_url||p.images||''})) : [];
    if(allProducts.length) localStorage.setItem('lastProducts',JSON.stringify(allProducts));
  }catch(e){
    allProducts = JSON.parse(localStorage.getItem('lastProducts')||'[]');
  }
  render();
}
function render(){
  const cart = JSON.parse(localStorage.getItem('cart')||'[]');
  const cont = document.getElementById('cartContainer');
  const sel = getLoc();
  document.getElementById('cartCount').textContent = cart.length?`(${cart.length})`:'';
  if(cart.length===0){cont.innerHTML=`<div class="empty"><p style="font-size:50px">🛒</p><p>Your cart is empty</p><button onclick="location.href='index.html'" style="margin-top:15px;padding:12px 30px;background:#ff6600;color:#fff;border:none;border-radius:5px">Continue Shopping</button></div>`;return;}
  let html=''; let total=0; let found=0;
  cart.forEach(it=>{
    const prod = allProducts.find(p=>String(p.id)===String(it.id) || p.name===it.name);
    if(!prod) return;
    found++; const sub=prod.price*it.qty; total+=sub;
    html+=`<div class="item"><img src="${prod.img}" onerror="this.src='https://via.placeholder.com/80'"><div class="item-info"><h4>${prod.name}</h4><p style="color:#666;font-size:13px">Size: ${it.size||'M'}</p><p style="color:#ff6600;font-weight:bold">KSh ${sub.toLocaleString()}</p><small>KSh ${prod.price.toLocaleString()} each</small><div class="qty-controls"><button class="qty-btn" onclick="updateQty('${it.id}',-1)">-</button><span>${it.qty}</span><button class="qty-btn" onclick="updateQty('${it.id}',1)">+</button><button class="qty-btn" style="margin-left:auto;color:red" onclick="removeItem('${it.id}')">×</button></div></div></div>`;
  });
  if(found===0){
    html=`<div class="empty"><p>Cart has old products not in DB anymore</p><p style="font-size:12px">You had Cream Polo from old CSV. Clear and add new products from DB</p><button onclick="localStorage.removeItem('cart');render();" style="margin-top:15px;padding:10px 20px;background:red;color:#fff;border:none;border-radius:5px">Clear Old Cart</button></div>`;
  }
  html+=`<div class="summary"><div class="trust-bar">🔒 Secure checkout • Pay on Delivery</div><label style="font-size:12px;color:#666;font-weight:bold">DELIVERY LOCATION</label><select id="locSel" onchange="updateLoc()">${locations.map(l=>`<option value="${l.name}" data-fee="${l.fee}" ${l.name===sel.name?'selected':''}>${l.name} - KSh ${l.fee}</option>`).join('')}</select><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Subtotal</span><span>KSh ${total.toLocaleString()}</span></div><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Delivery</span><span>KSh ${sel.fee}</span></div><div style="display:flex;justify-content:space-between;font-weight:bold;font-size:18px;margin:15px 0"><span>Total</span><span>KSh ${(total+sel.fee).toLocaleString()}</span></div><button class="btn-checkout" onclick="location.href='checkout.html'">Checkout</button></div>`;
  cont.innerHTML=html;
}
function updateLoc(){const s=document.getElementById('locSel');localStorage.setItem('selectedLocation',JSON.stringify({name:s.value,fee:parseInt(s.selectedOptions[0].dataset.fee)}));render();}
function updateQty(id,c){let cart=JSON.parse(localStorage.getItem('cart')||'[]');const it=cart.find(i=>String(i.id)===String(id));if(it){it.qty+=c;if(it.qty<=0)cart=cart.filter(i=>String(i.id)!==String(id));}localStorage.setItem('cart',JSON.stringify(cart));render();}
function removeItem(id){let cart=JSON.parse(localStorage.getItem('cart')||'[]');cart=cart.filter(i=>String(i.id)!==String(id));localStorage.setItem('cart',JSON.stringify(cart));render();}
load();
</script>
</body>
</html>
