<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Kitui Collection</title>
<style>
body{font-family:Arial,sans-serif;padding:20px;max-width:600px;margin:auto;text-align:center;background:#f5f5f5}
.container{background:#fff;padding:25px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h2{margin-bottom:10px}
p{color:#666;margin-bottom:20px}
.pay-option{width:100%;padding:15px;background:#fff;border:2px solid #ddd;border-radius:8px;font-size:16px;font-weight:bold;margin:10px 0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.pay-option:active{border-color:#ff6600}
.pay-now{background:#28a745;color:#fff;border-color:#28a745}
.pay-cod{background:#ff6600;color:#fff;border-color:#ff6600}
nav{margin-bottom:20px;text-align:left}
nav a{margin-right:15px;text-decoration:none;color:#333;font-weight:bold}
.icon{font-size:22px}
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="cart.html">Cart</a>
</nav>

<div class="container">
  <h2>Select Payment Method</h2>
  <p>Choose how you want to pay</p>

  <button class="pay-option pay-now" onclick="pay('mpesa')">
    <span class="icon">📱</span> Pay Now with M-Pesa
  </button>

  <button class="pay-option pay-now" onclick="pay('card')">
    <span class="icon">💳</span> Pay Now with Card
  </button>

  <button class="pay-option pay-cod" onclick="pay('cod')">
    <span class="icon">💵</span> Pay on Delivery
  </button>
</div>

<script>
function pay(method){
  localStorage.setItem('paymentMethod', method);
  localStorage.setItem('paymentStatus', method === 'cod' ? 'pending' : 'paid');
  window.location.href = 'confirmation.html';
}
</script>

</body>
</html>
