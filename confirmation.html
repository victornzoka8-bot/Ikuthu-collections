<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed - Ikuthu Collections</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f1f3f6;max-width:900px;margin:auto;padding:0}
.top-bar{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:sticky;top:0;z-index:10}
.top-bar a{color:#333;text-decoration:none;font-weight:600;font-size:14px}
.secure{display:flex;align-items:center;gap:6px;color:#25D366;font-weight:700;font-size:13px}
.steps{display:flex;gap:8px;padding:15px 20px;background:#fff;margin-bottom:12px}
.step{flex:1;height:4px;background:#e0e0e0;border-radius:2px}.step.active{background:#ff6600}
.container{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 110px);padding:16px}
.card{background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.08);animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.icon-wrap{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative}
.icon-wrap.success{background:linear-gradient(135deg,#4caf50 0%,#2e7d32 100%);box-shadow:0 8px 20px rgba(76,175,80,0.3)}
.icon-wrap.pending{background:linear-gradient(135deg,#ff9800 0%,#ff6600 100%);box-shadow:0 8px 20px rgba(255,152,0,0.3)}
.icon-wrap::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px dashed rgba(0,0,0,0.06)}
.icon{font-size:42px;color:#fff;font-weight:900}
h1{font-size:26px;font-weight:800;color:#111;margin-bottom:8px}
.sub{color:#666;font-size:14px;line-height:1.6;margin-bottom:20px}
.order-box{background:#f9fafb;border:1px solid #eef0f2;border-radius:12px;padding:16px;text-align:left;margin:20px 0}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid #f0f0f0}
.row:last-child{border:none}
.row span:first-child{color:#777;font-weight:600}
.row span:last-child{color:#111;font-weight:700}
.row.total{background:linear-gradient(135deg,#ff6600 0%,#ff8533 100%);color:#fff;margin:10px -8px -8px;padding:12px 16px;border-radius:0 0 10px 10px;display:flex;justify-content:space-between}
.row.total span{color:#fff!important;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}
.badge.success{background:#e8f5e9;color:#2e7d32}
.badge.pending{background:#fff3e0;color:#e65100}
.btn{width:100%;background:#ff6600;color:#fff;padding:15px 30px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;display:block;box-shadow:0 4px 14px rgba(255,102,0,0.3);transition:.2s;margin-top:8px}
.btn:active{transform:scale(0.98)}
.btn.sec{background:#111;color:#fff;box-shadow:none;margin-top:10px}
.trust{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.trust span{font-size:11px;background:#f5f5f5;padding:6px 10px;border-radius:20px;font-weight:600}
.support{font-size:12px;color:#999;margin-top:18px}
.support a{color:#ff6600;text-decoration:none;font-weight:700}
.check-list{text-align:left;background:#f0faf0;border-radius:10px;padding:14px;margin:16px 0}
.check-list li{list-style:none;font-size:12.5px;padding:6px 0;display:flex;gap:8px;color:#444}
</style>
</head>
<body>

<div class="top-bar">
<a href="index.html">Ikuthu Collections</a>
<div class="secure">✓ Order Secured</div>
</div>

<div class="steps"><div class="step active"></div><div class="step active"></div></div>

<div class="container">
<div class="card" id="content">
<h1>Loading...</h1>
</div>
</div>

<script>
const order = JSON.parse(localStorage.getItem('pendingOrder') || '{}');
const content = document.getElementById('content');

if(!order.total){
  content.innerHTML = `
    <div class="icon-wrap pending"><div class="icon">!</div></div>
    <h1>No Order Found</h1>
    <p class="sub">Looks like you refreshed the page or your session expired. Don't worry, your cart is still safe.</p>
    <a href="index.html" class="btn">Back to Shop →</a>
    <p class="support">Need help? <a href="https://wa.me/254758903057">Chat on WhatsApp</a></p>
  `;
} else if(order.paymentMethod === 'cod'){
  const orderId = 'IKU-' + Date.now().toString().slice(-6);
  content.innerHTML = `
    <div class="badge success">● Order Confirmed</div>
    <div class="icon-wrap success"><div class="icon">✓</div></div>
    <h1>Order Placed!</h1>
    <p class="sub">Thanks ${order.name?.split(' ')[0]||''}! We received your order. Pay cash to the rider when we deliver.</p>
    
    <div class="order-box">
      <div class="row"><span>Order ID</span><span>${orderId}</span></div>
      <div class="row"><span>Customer</span><span>${order.name||''}</span></div>
      <div class="row"><span>Email</span><span>${order.email||'N/A'}</span></div>
      <div class="row"><span>Phone</span><span>${order.phone||order.mpesaPhone||''}</span></div>
      <div class="row"><span>Address</span><span style="text-align:right;max-width:55%">${order.address||''}</span></div>
      <div class="row"><span>Payment</span><span>Pay on Delivery 💵</span></div>
      <div class="row total"><span>Total to Pay</span><span>KSh ${order.total.toLocaleString()}</span></div>
    </div>

    <ul class="check-list">
      <li>📦 <span>Packing your order — we dispatch within 24hrs</span></li>
      <li>🚚 <span>Rider will call you before delivery</span></li>
      <li>✉️ <span>Receipt sent to <b>${order.email||'your email'}</b></span></li>
    </ul>

    <a href="index.html" class="btn">Continue Shopping →</a>
    <a href="https://wa.me/254758903057?text=Hi, my order ${orderId} for KSh ${order.total}" class="btn sec">Chat on WhatsApp</a>
    <div class="trust"><span>🚚 Fast Delivery</span><span>🔄 7-Day Return</span><span>🔒 Secure</span></div>
  `;
  // keep order for 5 sec then clear for screenshot
  setTimeout(()=>localStorage.removeItem('pendingOrder'), 3000);
} else {
  const orderId = 'IKU-' + (order.checkoutRequestId?.slice(-6) || Date.now().toString().slice(-6));
  content.innerHTML = `
    <div class="badge pending">● Awaiting Verification</div>
    <div class="icon-wrap pending"><div class="icon">⏳</div></div>
    <h1>Payment Pending</h1>
    <p class="sub">We received your order${order.screenshot ? ' and screenshot' : ''}. We’ll verify your M-Pesa payment in 5-10 mins and confirm via SMS.</p>
    
    <div class="order-box">
      <div class="row"><span>Order ID</span><span>${orderId}</span></div>
      <div class="row"><span>Total Paid</span><span>KSh ${order.total.toLocaleString()}</span></div>
      <div class="row"><span>Phone</span><span>${order.mpesaPhone||order.phone||''}</span></div>
      <div class="row"><span>Email</span><span>${order.email||''}</span></div>
      <div class="row"><span>Status</span><span style="color:#e65100">Awaiting Verification ⏳</span></div>
      <div class="row total"><span>Amount</span><span>KSh ${order.total.toLocaleString()}</span></div>
    </div>

    <ul class="check-list" style="background:#fff8f0">
      <li>🔍 <span>We are verifying your M-Pesa transaction</span></li>
      <li>📲 <span>You will get SMS confirmation once verified</span></li>
      <li>✉️ <span>Receipt will be sent to <b>${order.email||'your email'}</b></span></li>
    </ul>

    <a href="index.html" class="btn">Back to Shop</a>
    <a href="https://wa.me/254758903057?text=Hi, verify my M-Pesa order ${orderId} KSh ${order.total}" class="btn sec">Send WhatsApp for Fast Verify</a>
    <p class="support">M-Pesa not confirmed? <a href="tel:+254758903057">Call 0758903057</a></p>
  `;
  setTimeout(()=>localStorage.removeItem('pendingOrder'), 3000);
}
</script>
</body>
</html>
